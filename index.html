<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Dokumentasi Media & IT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .swiper-slide {
      width: 100%;
      max-width: 800px;
    }
    .swiper-pagination-fraction {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      position: relative;
      margin-top: 15px;
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen pb-20 overflow-x-hidden">

  <!-- Header Section -->
  <header class="py-10 text-center bg-gradient-to-r from-blue-950 via-indigo-950 to-slate-950 border-b border-slate-800 shadow-2xl">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">MEDIA & IT HUB</h1>
    <p class="text-blue-300 mt-2 text-sm md:text-base">Dokumentasi Kegiatan, Galeri Foto & Karya Video</p>
  </header>

  <main class="max-w-6xl mx-auto py-10 px-4">
    
    <!-- MENU PILIH KEGIATAN -->
    <div class="mb-12">
      <div class="text-center mb-4">
        <span class="text-xs font-bold text-sky-400 uppercase tracking-widest bg-sky-950/60 border border-sky-800/80 px-4 py-1 rounded-full inline-block">
          <i class="fa-solid fa-list-check mr-1"></i> Pilih Kegiatan
        </span>
      </div>
      <div id="category-filters" class="flex flex-wrap justify-center gap-3 md:gap-4 max-w-4xl mx-auto">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- SECTION 1: GALERI FOTO -->
    <section class="mb-16">
      <div class="mb-6 flex items-center justify-between border-b border-slate-800/80 pb-3">
        <div>
          <h2 class="text-xl md:text-2xl font-bold text-sky-400 flex items-center gap-2">
            <i class="fa-regular fa-images text-sky-400"></i> Galeri Foto
          </h2>
          <p id="current-activity-title" class="text-slate-400 text-xs mt-1">Menampilkan dokumentasi foto</p>
        </div>
      </div>

      <!-- Swiper Foto -->
      <div class="relative px-2 md:px-12">
        <div class="swiper mySwiperFoto overflow-hidden rounded-2xl">
          <div class="swiper-wrapper" id="photo-container">
            <div class="text-center w-full py-16 text-slate-400">
              <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-sky-400"></i>
              <p>Memuat data foto...</p>
            </div>
          </div>
        </div>

        <button id="btn-foto-prev" class="absolute top-1/2 left-0 -translate-y-1/2 z-20 bg-slate-900/90 hover:bg-sky-600 text-white w-10 h-10 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-xl">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <button id="btn-foto-next" class="absolute top-1/2 right-0 -translate-y-1/2 z-20 bg-slate-900/90 hover:bg-sky-600 text-white w-10 h-10 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-xl">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>

        <div class="swiper-pagination-foto swiper-pagination-fraction"></div>
      </div>
    </section>

    <!-- SECTION 2: DOKUMENTASI VIDEO -->
    <section id="video-section" class="hidden">
      <div class="mb-6 border-b border-slate-800/80 pb-3">
        <h2 class="text-xl md:text-2xl font-bold text-red-500 flex items-center gap-2">
          <i class="fa-solid fa-circle-play"></i> Dokumentasi Video
        </h2>
        <p class="text-slate-400 text-xs mt-1">Klik pada video untuk memutar</p>
      </div>

      <div class="relative px-2 md:px-12">
        <div class="swiper mySwiperVideo overflow-hidden rounded-2xl">
          <div class="swiper-wrapper" id="video-container">
            <!-- Video Slides -->
          </div>
        </div>

        <button id="btn-video-prev" class="absolute top-1/2 left-0 -translate-y-1/2 z-20 bg-slate-900/90 hover:bg-red-600 text-white w-10 h-10 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-xl">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <button id="btn-video-next" class="absolute top-1/2 right-0 -translate-y-1/2 z-20 bg-slate-900/90 hover:bg-red-600 text-white w-10 h-10 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-xl">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>

        <div class="swiper-pagination-video swiper-pagination-fraction"></div>
      </div>
    </section>

  </main>

  <!-- MODAL FOTO PREVIEW -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <button onclick="closeModal('image-modal')" class="absolute -top-10 right-0 text-white hover:text-red-400 text-lg font-bold flex items-center gap-1">
        <i class="fa-solid fa-xmark"></i> Tutup
      </button>
      <img id="modal-img" src="" class="max-h-[80vh] w-auto rounded-lg shadow-2xl border border-slate-700 object-contain" />
      <div class="mt-4">
        <button id="modal-download-btn" onclick="directDownload()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-6 py-2.5 rounded-full flex items-center gap-2 text-sm shadow-xl transition-all">
          <i class="fa-solid fa-download"></i> Download Foto
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL VIDEO PLAYER -->
  <div id="video-modal" class="fixed inset-0 z-50 bg-black/90 hidden backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <button onclick="closeVideoModal()" class="absolute -top-10 right-0 text-white hover:text-red-400 text-lg font-bold flex items-center gap-1">
        <i class="fa-solid fa-xmark"></i> Tutup Player
      </button>
      <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black border border-slate-700 shadow-2xl">
        <iframe id="modal-video-iframe" src="" class="w-full h-full" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxzEHb5DqayWnhAnuG8ujbFFiYh2C3mwjdPGjo9U1pM-61nRnotJ9S80RAFBrKTaONr/exec";
    
    let rawData = [];
    let groupedData = {};
    let swiperFotoInstance = null;
    let swiperVideoInstance = null;
    let currentDownloadUrl = "";

    function formatDate(rawDate) {
      if (!rawDate) return '';
      const date = new Date(rawDate);
      if (isNaN(date.getTime())) return rawDate;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Helper Parser Embed Video
    function getEmbedUrl(url) {
      if (!url) return null;
      let cleanUrl = url.trim();

      if (cleanUrl.includes('youtube.com') || cleanUrl.includes('youtu.be')) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = cleanUrl.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : cleanUrl;
      }
      
      if (cleanUrl.includes('drive.google.com') || cleanUrl.includes('lh3.googleusercontent.com')) {
        const match = cleanUrl.match(/\/d\/([^\/]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/file/d/${match[1]}/preview`;
        }
      }

      return cleanUrl;
    }

    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        rawData = await response.json();
        
        groupedData = {};
        rawData.forEach(item => {
          if (!groupedData[item.judul]) {
            groupedData[item.judul] = [];
          }
          groupedData[item.judul].push(item);
        });

        renderFilterButtons();
        
        const firstCategory = Object.keys(groupedData)[0];
        if (firstCategory) {
          selectCategory(firstCategory);
        }

      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    function renderFilterButtons() {
      const filterContainer = document.getElementById('category-filters');
      filterContainer.innerHTML = '';

      Object.keys(groupedData).forEach((catName, index) => {
        const btn = document.createElement('button');
        const activeStyle = "bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 border-sky-400 font-extrabold shadow-lg shadow-sky-500/30 scale-105";
        const inactiveStyle = "bg-slate-900/90 text-slate-300 border-slate-800 hover:border-slate-600 hover:bg-slate-800 font-semibold";

        btn.className = `cat-btn px-5 py-3 rounded-2xl text-xs md:text-sm border transition-all duration-300 flex items-center gap-2.5 cursor-pointer ${index === 0 ? activeStyle : inactiveStyle}`;
        btn.innerHTML = `
          <i class="fa-solid fa-folder-open text-base"></i>
          <span>${catName}</span>
          <span class="bg-black/30 px-2 py-0.5 rounded-full text-[11px] border border-white/10">${groupedData[catName].length}</span>
        `;

        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.className = `cat-btn px-5 py-3 rounded-2xl text-xs md:text-sm border transition-all duration-300 flex items-center gap-2.5 cursor-pointer ${inactiveStyle}`);
          btn.className = `cat-btn px-5 py-3 rounded-2xl text-xs md:text-sm border transition-all duration-300 flex items-center gap-2.5 cursor-pointer ${activeStyle}`;
          selectCategory(catName);
        };

        filterContainer.appendChild(btn);
      });
    }

    function selectCategory(categoryName) {
      const items = groupedData[categoryName];
      document.getElementById('current-activity-title').innerText = `Kegiatan: ${categoryName} — Total ${items.length} Dokumentasi`;

      // 1. RENDER FOTO
      const photoContainer = document.getElementById('photo-container');
      photoContainer.innerHTML = '';

      items.forEach(item => {
        if (item.gambarUrl) {
          const slideHtml = `
            <div class="swiper-slide bg-slate-900 rounded-2xl overflow-hidden shadow-xl border border-slate-800">
              <div class="relative group bg-black cursor-pointer aspect-[4/3]" onclick="openModal('${item.gambarUrl}')">
                <img src="${item.gambarUrl}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 text-white font-medium text-xs md:text-sm">
                  <i class="fa-solid fa-expand text-lg"></i> Perbesar Foto
                </div>
              </div>
              <div class="p-4 bg-slate-900">
                <span class="text-[11px] font-semibold text-sky-400 bg-sky-950 border border-sky-800/60 px-2.5 py-0.5 rounded-full inline-block mb-1.5">
                  <i class="fa-regular fa-calendar-check mr-1"></i> ${formatDate(item.tanggal)}
                </span>
                <p class="text-slate-300 text-xs md:text-sm leading-relaxed line-clamp-2">${item.deskripsi || ''}</p>
              </div>
            </div>
          `;
          photoContainer.insertAdjacentHTML('beforeend', slideHtml);
        }
      });

      if (swiperFotoInstance) swiperFotoInstance.destroy(true, true);
      swiperFotoInstance = new Swiper(".mySwiperFoto", {
        slidesPerView: 1,
        spaceBetween: 20,
        grabCursor: true,
        autoplay: { delay: 15000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination-foto", type: "fraction" },
        navigation: { nextEl: "#btn-foto-next", prevEl: "#btn-foto-prev" },
      });

      // 2. RENDER VIDEO
      const videoSection = document.getElementById('video-section');
      const videoContainer = document.getElementById('video-container');
      videoContainer.innerHTML = '';

      const videoItems = items.filter(i => i.videoUrl && i.videoUrl.trim() !== '');

      if (videoItems.length > 0) {
        videoSection.classList.remove('hidden');
        
        videoItems.forEach(item => {
          const embedVideo = getEmbedUrl(item.videoUrl);
          const videoSlideHtml = `
            <div class="swiper-slide bg-slate-900 rounded-2xl overflow-hidden shadow-xl border border-slate-800 p-4">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold text-red-400 bg-red-950 border border-red-800/60 px-2.5 py-1 rounded-full flex items-center gap-1">
                  <i class="fa-solid fa-video"></i> Video Dokumentasi
                </span>
                <span class="text-xs text-slate-400">
                  <i class="fa-regular fa-calendar mr-1"></i> ${formatDate(item.tanggal)}
                </span>
              </div>
              
              <!-- Card Clickable untuk Play Video -->
              <div class="relative aspect-video w-full rounded-xl overflow-hidden bg-slate-950 border border-slate-800 shadow-inner mb-3 cursor-pointer group" onclick="openVideoModal('${embedVideo}')">
                <img src="${item.gambarUrl}" class="w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-300" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-center justify-center">
                  <div class="w-16 h-16 rounded-full bg-red-600/90 text-white flex items-center justify-center group-hover:scale-110 group-hover:bg-red-500 transition-all shadow-2xl border-2 border-white/20">
                    <i class="fa-solid fa-play text-2xl ml-1"></i>
                  </div>
                </div>
                <div class="absolute bottom-3 left-3 right-3 text-xs text-slate-200 font-medium">
                  Klik untuk Putar Video
                </div>
              </div>

              <p class="text-slate-300 text-xs md:text-sm line-clamp-2">${item.deskripsi || item.judul}</p>
            </div>
          `;
          videoContainer.insertAdjacentHTML('beforeend', videoSlideHtml);
        });

        if (swiperVideoInstance) swiperVideoInstance.destroy(true, true);
        swiperVideoInstance = new Swiper(".mySwiperVideo", {
          slidesPerView: 1,
          spaceBetween: 20,
          pagination: { el: ".swiper-pagination-video", type: "fraction" },
          navigation: { nextEl: "#btn-video-next", prevEl: "#btn-video-prev" },
        });

      } else {
        videoSection.classList.add('hidden');
      }
    }

    // Modal Video Controls
    function openVideoModal(videoEmbedUrl) {
      document.getElementById('modal-video-iframe').src = videoEmbedUrl;
      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('modal-video-iframe').src = '';
      document.getElementById('video-modal').classList.add('hidden');
    }

    // Modal Image Controls
    function openModal(imgUrl) {
      currentDownloadUrl = imgUrl;
      document.getElementById('modal-img').src = imgUrl;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    async function directDownload() {
      if (!currentDownloadUrl) return;
      try {
        const btn = document.getElementById('modal-download-btn');
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengunduh...`;
        
        const response = await fetch(currentDownloadUrl);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `dokumentasi-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btn.innerHTML = `<i class="fa-solid fa-download"></i> Download Foto`;
      } catch (err) {
        window.open(currentDownloadUrl, '_blank');
      }
    }

    loadData();
  </script>
</body>
</html>
