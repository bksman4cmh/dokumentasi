<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Dokumentasi Media & IT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 320px;
      height: 420px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased">

  <header class="py-12 text-center bg-gradient-to-r from-blue-700 via-indigo-800 to-slate-900 border-b border-slate-800">
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">MEDIA & IT HUB</h1>
    <p class="text-blue-200 mt-2 text-lg">Dokumentasi Kegiatan, Karya Video & Galeri Digital</p>
  </header>

  <section class="max-w-6xl mx-auto py-12 px-4">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold text-sky-400">Dokumentasi Unggulan</h2>
        <p class="text-slate-400 text-sm">Geser kartu untuk melihat keseruan kegiatan</p>
      </div>
    </div>

    <div class="swiper mySwiper">
      <div class="swiper-wrapper" id="card-container">
        <div class="text-center w-full py-10 text-slate-400">Memuat dokumentasi terbaru...</div>
      </div>
      <div class="swiper-pagination mt-6"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // MASUKKAN URL DEPLOYMENT GAS KAMU DI SINI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxzEHb5DqayWnhAnuG8ujbFFiYh2C3mwjdPGjo9U1pM-61nRnotJ9S80RAFBrKTaONr/exec";

    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        const items = await response.json();
        
        const container = document.getElementById('card-container');
        container.innerHTML = ''; // bersihkan loader

        items.forEach(item => {
          const slideHtml = `
            <div class="swiper-slide bg-slate-800 rounded-xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col">
              <img src="${item.gambarUrl}" alt="${item.judul}" class="w-full h-48 object-cover" />
              <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                  <span class="text-xs text-sky-400 font-semibold uppercase tracking-wider">${item.tanggal}</span>
                  <h3 class="text-xl font-bold mt-1 text-white">${item.judul}</h3>
                  <p class="text-slate-300 text-sm mt-2 line-clamp-3">${item.deskripsi}</p>
                </div>
                ${item.videoUrl ? `
                  <a href="${item.videoUrl}" target="_blank" class="mt-4 inline-block text-center bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition-colors">
                    ▶ Tonton Video
                  </a>
                ` : ''}
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', slideHtml);
        });

        // Inisialisasi Swiper Card Effect
        new Swiper(".mySwiper", {
          effect: "cards",
          grabCursor: true,
          pagination: {
            el: ".swiper-pagination",
            clickable: true,
          },
        });

      } catch (err) {
        console.error("Gagal memuat data dari GAS:", err);
      }
    }

    loadData();
  </script>
</body>
</html>
