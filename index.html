<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Dokumentasi Media & IT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Styling ukuran Card Slideshow */
    .swiper-slide {
      width: 100%;
      max-width: 850px;
      height: auto;
    }
    /* Custom Pagination Styling */
    .swiper-pagination-fraction {
      color: #38bdf8;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      bottom: -40px !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen pb-20">

  <!-- Header Section -->
  <header class="py-12 text-center bg-gradient-to-r from-blue-900 via-indigo-950 to-slate-950 border-b border-slate-800">
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">MEDIA & IT HUB</h1>
    <p class="text-blue-300 mt-2 text-sm md:text-base">Dokumentasi Kegiatan, Karya Video & Galeri Digital</p>
  </header>

  <!-- Section Card Slideshow -->
  <section class="max-w-6xl mx-auto py-12 px-4 relative">
    <div class="mb-8 text-center md:text-left">
      <h2 class="text-2xl md:text-3xl font-bold text-sky-400">Dokumentasi Unggulan</h2>
      <p class="text-slate-400 text-sm">Geser atau pakai panah untuk melihat dokumentasi kegiatan</p>
    </div>

    <!-- Swiper Container Wrapper -->
    <div class="relative px-2 md:px-10">
      <div class="swiper mySwiper overflow-visible">
        <div class="swiper-wrapper" id="card-container">
          <!-- Loader -->
          <div class="text-center w-full py-20 text-slate-400">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-sky-400"></i>
            <p>Memuat data kegiatan...</p>
          </div>
        </div>
      </div>

      <!-- Custom Pagination & Navigasi Panah Keren -->
      <div class="swiper-pagination"></div>
      <button id="btn-prev" class="absolute top-1/2 -left-2 md:left-0 -translate-y-1/2 z-20 bg-slate-800/80 hover:bg-sky-600 text-white w-10 h-10 md:w-12 md:h-12 rounded-full border border-slate-600 backdrop-blur-md flex items-center justify-center transition-all shadow-lg">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button id="btn-next" class="absolute top-1/2 -right-2 md:right-0 -translate-y-1/2 z-20 bg-slate-800/80 hover:bg-sky-600 text-white w-10 h-10 md:w-12 md:h-12 rounded-full border border-slate-600 backdrop-blur-md flex items-center justify-center transition-all shadow-lg">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <!-- MODAL / LIGHTBOX PREVIEW FOTO -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <button onclick="closeModal()" class="absolute -top-12 right-0 text-white hover:text-red-400 text-2xl">
        <i class="fa-solid fa-xmark"></i> Tutup
      </button>
      <img id="modal-img" src="" class="max-h-[80vh] w-auto rounded-lg shadow-2xl border border-slate-700 object-contain" />
      <div class="mt-4 flex gap-4">
        <a id="modal-download" href="" download target="_blank" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-6 py-2.5 rounded-full flex items-center gap-2 shadow-lg transition-all">
          <i class="fa-solid fa-download"></i> Download Foto
        </a>
      </div>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // URL Deployment Apps Script
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxzEHb5DqayWnhAnuG8ujbFFiYh2C3mwjdPGjo9U1pM-61nRnotJ9S80RAFBrKTaONr/exec";

    // Helper merapikan tampilan tanggal
    function formatDate(rawDate) {
      if (!rawDate) return '';
      const date = new Date(rawDate);
      if (isNaN(date.getTime())) return rawDate; // jika sudah berupa teks
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Helper Ekstraksi Embed Video Youtube / Drive
    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
      }
      return url;
    }

    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        const items = await response.json();
        
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        items.forEach(item => {
          const formattedDate = formatDate(item.tanggal);
          const embedVideo = getEmbedUrl(item.videoUrl);

          const slideHtml = `
            <div class="swiper-slide bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 grid grid-cols-1 md:grid-cols-12 gap-0">
              
              <!-- Kolom Kiri: Foto Rasio 4:3 dengan fungsi Preview Klik -->
              <div class="md:col-span-5 relative group bg-black cursor-pointer overflow-hidden aspect-[4/3] md:aspect-auto" onclick="openModal('${item.gambarUrl}')">
                <img src="${item.gambarUrl}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 text-white font-medium text-sm">
                  <i class="fa-solid fa-expand text-xl"></i> Klik untuk Perbesar
                </div>
              </div>

              <!-- Kolom Kanan: Detail & Area Video terpisah -->
              <div class="md:col-span-7 p-5 md:p-6 flex flex-col justify-between bg-slate-900">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-semibold text-sky-400 bg-sky-950/80 border border-sky-800/50 px-3 py-1 rounded-full">
                      <i class="fa-regular fa-calendar-check mr-1"></i> ${formattedDate}
                    </span>
                  </div>
                  <h3 class="text-xl md:text-2xl font-bold text-white mb-2">${item.judul}</h3>
                  <p class="text-slate-300 text-sm leading-relaxed mb-4 line-clamp-3">${item.deskripsi}</p>
                </div>

                <!-- Bagian Khusus Video -->
                <div class="mt-2 border-t border-slate-800 pt-3">
                  ${embedVideo ? `
                    <p class="text-xs text-slate-400 mb-2 font-medium flex items-center gap-1">
                      <i class="fa-solid fa-video text-red-500"></i> Dokumentasi Video:
                    </p>
                    <div class="aspect-video w-full rounded-lg overflow-hidden bg-black border border-slate-800">
                      <iframe src="${embedVideo}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                    </div>
                  ` : `
                    <div class="text-xs text-slate-500 italic py-2">
                      <i class="fa-solid fa-info-circle mr-1"></i> Tidak ada lampiran video
                    </div>
                  `}
                </div>

              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', slideHtml);
        });

        // Inisialisasi Swiper dengan Efek Card & Custom Pagination
        new Swiper(".mySwiper", {
          effect: "cards",
          grabCursor: true,
          pagination: {
            el: ".swiper-pagination",
            type: "fraction", // Mengubah titik-titik jadi penomoran angka elegan (cth: 1 / 5)
          },
          navigation: {
            nextEl: "#btn-next",
            prevEl: "#btn-prev",
          },
        });

      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    // Modal Lightbox Controller
    function openModal(imgUrl) {
      document.getElementById('modal-img').src = imgUrl;
      document.getElementById('modal-download').href = imgUrl;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    loadData();
  </script>
</body>
</html>
