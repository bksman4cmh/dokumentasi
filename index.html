<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Dokumentasi Media & IT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .swiper-slide {
      width: 100%;
      max-width: 750px;
    }
    .swiper-pagination-fraction {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      position: relative;
      margin-top: 15px;
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen pb-20 overflow-x-hidden">

  <!-- Header Section -->
  <header class="py-10 text-center bg-gradient-to-r from-blue-950 via-indigo-950 to-slate-950 border-b border-slate-800">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">MEDIA & IT HUB</h1>
    <p class="text-blue-300 mt-2 text-sm">Dokumentasi Kegiatan, Galeri Foto & Karya Video</p>
  </header>

  <main class="max-w-6xl mx-auto py-8 px-4">
    
    <!-- Filter Kategori Kegiatan -->
    <div class="mb-10 text-center">
      <p class="text-xs font-semibold text-sky-400 uppercase tracking-widest mb-3">Pilih Kegiatan</p>
      <div id="category-filters" class="flex flex-wrap justify-center gap-2">
        <!-- Filter Button akan terisi otomatis -->
      </div>
    </div>

    <!-- SECTION 1: GALERI FOTO -->
    <section class="mb-16">
      <div class="mb-6 flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-xl md:text-2xl font-bold text-sky-400 flex items-center gap-2">
            <i class="fa-regular fa-images"></i> Galeri Foto
          </h2>
          <p id="current-activity-title" class="text-slate-400 text-xs mt-1">Menampilkan dokumentasi foto</p>
        </div>
      </div>

      <!-- Swiper Foto -->
      <div class="relative px-2 md:px-12">
        <div class="swiper mySwiperFoto overflow-hidden rounded-2xl">
          <div class="swiper-wrapper" id="photo-container">
            <!-- Loader -->
            <div class="text-center w-full py-16 text-slate-400">
              <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-sky-400"></i>
              <p>Memuat data foto...</p>
            </div>
          </div>
        </div>

        <!-- Tombol Navigasi Swiper Foto -->
        <button id="btn-foto-prev" class="absolute top-1/2 left-0 -translate-y-1/2 z-20 bg-slate-800/90 hover:bg-sky-600 text-white w-9 h-9 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-lg">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button id="btn-foto-next" class="absolute top-1/2 right-0 -translate-y-1/2 z-20 bg-slate-800/90 hover:bg-sky-600 text-white w-9 h-9 rounded-full border border-slate-700 backdrop-blur-md flex items-center justify-center transition-all shadow-lg">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <div class="swiper-pagination-foto swiper-pagination-fraction"></div>
      </div>
    </section>

    <!-- SECTION 2: DOKUMENTASI VIDEO (TERPISAH) -->
    <section id="video-section" class="hidden">
      <div class="mb-6 border-b border-slate-800 pb-3">
        <h2 class="text-xl md:text-2xl font-bold text-red-500 flex items-center gap-2">
          <i class="fa-solid fa-circle-play"></i> Dokumentasi Video
        </h2>
        <p class="text-slate-400 text-xs mt-1">Video terkait kegiatan ini</p>
      </div>

      <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Container video disisipkan via JS -->
      </div>
    </section>

  </main>

  <!-- MODAL / LIGHTBOX PREVIEW FOTO -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <button onclick="closeModal()" class="absolute -top-10 right-0 text-white hover:text-red-400 text-lg font-bold flex items-center gap-1">
        <i class="fa-solid fa-xmark"></i> Tutup
      </button>
      <img id="modal-img" src="" class="max-h-[80vh] w-auto rounded-lg shadow-2xl border border-slate-700 object-contain" />
      <div class="mt-4">
        <button id="modal-download-btn" onclick="directDownload()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-5 py-2 rounded-full flex items-center gap-2 text-sm shadow-lg transition-all">
          <i class="fa-solid fa-download"></i> Download Foto
        </button>
      </div>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxzEHb5DqayWnhAnuG8ujbFFiYh2C3mwjdPGjo9U1pM-61nRnotJ9S80RAFBrKTaONr/exec";
    
    let rawData = [];
    let groupedData = {};
    let swiperFotoInstance = null;
    let currentDownloadUrl = "";

    function formatDate(rawDate) {
      if (!rawDate) return '';
      const date = new Date(rawDate);
      if (isNaN(date.getTime())) return rawDate;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
      }
      return url;
    }

    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        rawData = await response.json();
        
        // Grouping data berdasarkan Judul Kegiatan
        groupedData = {};
        rawData.forEach(item => {
          if (!groupedData[item.judul]) {
            groupedData[item.judul] = [];
          }
          groupedData[item.judul].push(item);
        });

        renderFilterButtons();
        
        // Default pilih kegiatan pertama
        const firstCategory = Object.keys(groupedData)[0];
        if (firstCategory) {
          selectCategory(firstCategory);
        }

      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    function renderFilterButtons() {
      const filterContainer = document.getElementById('category-filters');
      filterContainer.innerHTML = '';

      Object.keys(groupedData).forEach((catName, index) => {
        const btn = document.createElement('button');
        btn.className = `cat-btn px-4 py-2 rounded-full text-xs font-semibold border transition-all duration-200 ${
          index === 0 
            ? 'bg-sky-500 text-slate-950 border-sky-400 shadow-lg shadow-sky-500/20' 
            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
        }`;
        btn.innerText = `${catName} (${groupedData[catName].length})`;
        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => {
            b.className = 'cat-btn px-4 py-2 rounded-full text-xs font-semibold border border-slate-800 bg-slate-900 text-slate-300 hover:border-slate-600';
          });
          btn.className = 'cat-btn px-4 py-2 rounded-full text-xs font-semibold border border-sky-400 bg-sky-500 text-slate-950 shadow-lg shadow-sky-500/20';
          selectCategory(catName);
        };
        filterContainer.appendChild(btn);
      });
    }

    function selectCategory(categoryName) {
      const items = groupedData[categoryName];
      document.getElementById('current-activity-title').innerText = `Kegiatan: ${categoryName} — ${items.length} Foto`;

      // Render Swiper Foto
      const photoContainer = document.getElementById('photo-container');
      photoContainer.innerHTML = '';

      items.forEach(item => {
        if (item.gambarUrl) {
          const slideHtml = `
            <div class="swiper-slide bg-slate-900 rounded-2xl overflow-hidden shadow-xl border border-slate-800">
              <div class="relative group bg-black cursor-pointer aspect-[4/3]" onclick="openModal('${item.gambarUrl}')">
                <img src="${item.gambarUrl}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 text-white font-medium text-xs">
                  <i class="fa-solid fa-expand text-lg"></i> Perbesar
                </div>
              </div>
              <div class="p-4 bg-slate-900">
                <span class="text-[10px] font-semibold text-sky-400 bg-sky-950 border border-sky-800/60 px-2 py-0.5 rounded-full inline-block mb-1">
                  ${formatDate(item.tanggal)}
                </span>
                <p class="text-slate-300 text-xs leading-relaxed line-clamp-2">${item.deskripsi || ''}</p>
              </div>
            </div>
          `;
          photoContainer.insertAdjacentHTML('beforeend', slideHtml);
        }
      });

      // Reset & Re-init Swiper Foto dengan Autoplay 15 Detik
      if (swiperFotoInstance) swiperFotoInstance.destroy(true, true);
      swiperFotoInstance = new Swiper(".mySwiperFoto", {
        slidesPerView: 1,
        spaceBetween: 20,
        grabCursor: true,
        autoplay: {
          delay: 15000, // Slideshow jalan otomatis tiap 15 detik
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination-foto",
          type: "fraction",
        },
        navigation: {
          nextEl: "#btn-foto-next",
          prevEl: "#btn-foto-prev",
        },
      });

      // Render Video Section (Terpisah)
      const videoSection = document.getElementById('video-section');
      const videoGrid = document.getElementById('video-grid');
      videoGrid.innerHTML = '';

      const videoItems = items.filter(i => i.videoUrl && i.videoUrl.trim() !== '');

      if (videoItems.length > 0) {
        videoSection.classList.remove('hidden');
        videoItems.forEach(item => {
          const embedVideo = getEmbedUrl(item.videoUrl);
          const videoHtml = `
            <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl">
              <h4 class="text-sm font-bold text-white mb-2 flex items-center gap-2">
                <i class="fa-solid fa-video text-red-500"></i> ${item.judul}
              </h4>
              <div class="aspect-video w-full rounded-lg overflow-hidden bg-black border border-slate-800 mb-2">
                <iframe src="${embedVideo}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
              </div>
              <p class="text-slate-400 text-xs">${item.deskripsi || ''}</p>
            </div>
          `;
          videoGrid.insertAdjacentHTML('beforeend', videoHtml);
        });
      } else {
        videoSection.classList.add('hidden');
      }
    }

    // Direct Download Foto Tanpa Buka Tab Baru
    async function directDownload() {
      if (!currentDownloadUrl) return;
      try {
        const btn = document.getElementById('modal-download-btn');
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengunduh...`;
        
        const response = await fetch(currentDownloadUrl);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `dokumentasi-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btn.innerHTML = `<i class="fa-solid fa-download"></i> Download Foto`;
      } catch (err) {
        // Fallback jika kena CORS kebijakan Drive
        window.open(currentDownloadUrl, '_blank');
      }
    }

    function openModal(imgUrl) {
      currentDownloadUrl = imgUrl;
      document.getElementById('modal-img').src = imgUrl;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    loadData();
  </script>
</body>
</html>
